name: Directory change
description: Suggest an address or asset, correct a label, or request a removal.
body:
  - type: dropdown
    id: network
    attributes:
      label: Network
      options:
        - mainnet
        - testnet
        - futurenet
    validations:
      required: true
  - type: input
    id: identifier
    attributes:
      label: Public Stellar identifier
      description: Enter a full uppercase address or validator key, an asset code and issuer, or native XLM.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What should change?
      description: Provide the proposed label or explain why the entry needs to be corrected or removed.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Public source link
      description: Link to a public page that shows the identifier and supports the change.
