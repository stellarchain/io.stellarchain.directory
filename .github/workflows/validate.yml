name: Validate directory

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: directory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate CSV and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 2
      - run: python3 -m unittest discover -s tests
      - run: python3 scripts/build.py
      - name: Summarize directory changes
        if: github.event_name == 'pull_request'
        run: python3 scripts/review_csv.py HEAD^1

  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
      - run: npm ci --no-audit
      - name: Deploy and verify the current main commit
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          remote_main=$(git ls-remote --exit-code origin refs/heads/main)
          if [ "${remote_main%%[[:space:]]*}" != "$GITHUB_SHA" ]; then
            echo "A newer commit is on main. Skipping this release."
            exit 0
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Configure CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in the production environment."
            exit 1
          fi
          npm run deploy
          python3 scripts/smoke.py
